[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activity-insights"
version = "0.1.0"
description = "A Streamlit report for exploring exported sports activities."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["activities", "cycling", "running", "sports", "streamlit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "altair>=5.0",
  "pandas>=2.0",
  "reportlab>=4.0",
  "streamlit>=1.50",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
]

[tool.setuptools]
py-modules = ["activity_processing", "data_loading", "reporting", "theme"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
